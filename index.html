<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote Generator-2</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        background-color: rgb(230, 241, 251);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background-color: rgb(248, 235, 246);
        width: 100%;
        max-width: 600px;

        padding: 30px;
        border-radius: 15px;

        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h1 {
        color: rgb(16, 16, 110);
        margin-bottom: 10px;
        font-size: 25px;
      }

      .quote-box {
        padding: 10px 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      #author {
        padding: 30px;
        color: #b45309;
        font-size: 16px;
        font-size: 20px;
      }

      button {
        background-color: #7b93b5;
        color: white;

        border: none;
        padding: 15px 30px;

        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;

        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #484e73;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="quote-box">
        <h1 id="quote">Random Quote</h1>
      </div>

      <div>
        <p id="author">-Author</p>
      </div>

      <button onclick="generateQuote()">New Quote</button>
    </div>
    <script>
      async function generateQuote() {
        const result = await fetch(
          "https://quoteslate.vercel.app/api/quotes/random",
        );
        const data = await result.json();

        document.getElementById("quote").innerText = data.quote;
        document.getElementById("author").innerText = data.author;
      }
    </script>
  </body>
</html>
